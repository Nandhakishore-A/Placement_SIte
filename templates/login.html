<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Placement Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center py-8 px-4 relative">
    <!-- Ambient Background Blobs -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-blue-600 rounded-full filter blur-[128px] opacity-30 animate-pulse pointer-events-none"></div>
    <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-indigo-600 rounded-full filter blur-[128px] opacity-30 animate-pulse pointer-events-none"></div>

    <div class="w-full max-w-4xl grid md:grid-cols-5 bg-slate-800/95 backdrop-blur-xl border border-slate-700/80 rounded-3xl shadow-2xl overflow-hidden z-10 my-auto">
        
        <!-- Left Banner (2 cols) -->
        <div class="md:col-span-2 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 p-8 md:p-10 flex flex-col justify-between text-white relative border-r border-slate-700/50">
            <div>
                <div class="flex items-center space-x-3 mb-8">
                    <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center border border-blue-500/30">
                        <i class="fa-solid fa-graduation-cap text-lg"></i>
                    </div>
                    <div>
                        <span class="font-bold tracking-tight text-base block leading-none text-white">Placement Cell</span>
                        <span class="text-[10px] text-blue-400 font-semibold tracking-wider uppercase">Portal Access</span>
                    </div>
                </div>
                
                <h2 class="text-2xl font-bold leading-tight mb-2 text-white">
                    Campus Placement Management
                </h2>
                <p class="text-slate-400 text-xs leading-relaxed">
                    Official recruitment and candidate tracking system for the Department of Training and Placement.
                </p>
            </div>

            <div class="pt-6 border-t border-slate-800 text-[11px] text-slate-500 flex items-center justify-between">
                <span>Placement System © 2026</span>
                <span class="text-slate-400 text-[10px] font-mono">v2.4</span>
            </div>
        </div>

        <!-- Right Form (3 cols) -->
        <div class="md:col-span-3 p-8 md:p-10 flex flex-col justify-center bg-slate-900/95">
            <div class="mb-6">
                <h3 class="text-xl font-bold text-white mb-1">Sign In</h3>
                <p class="text-slate-400 text-xs">Enter your credentials to access your account.</p>
            </div>

            <!-- Error Banner -->
            <div id="loginError" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorMessage">Invalid credentials</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <!-- Role Selection Field (Admin, Manager, Lead only) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Role</label>
                    <select id="roleSelector" onchange="onRoleChanged(this.value)"
                        class="w-full bg-slate-800/90 border border-slate-700 hover:border-slate-600 rounded-xl px-3.5 py-2.5 text-white text-xs focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition cursor-pointer">
                        <option value="admin">Admin</option>
                        <option value="manager">Manager</option>
                        <option value="lead">Lead</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                    <input type="text" id="username" required placeholder="Ex: Sivasubramaniyan Sir (or admin)" autocomplete="username"
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-xs focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                    <input type="password" id="password" required placeholder="Ex: Placement_head@123" autocomplete="current-password"
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-xs focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition duration-200 flex items-center justify-center space-x-2 cursor-pointer shadow-sm">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

    </div>

    <script>
        const rolePlaceholders = {
            'admin': {
                user: 'Ex: Sivasubramaniyan Sir (or admin)',
                pass: 'Ex: Placement_head@123'
            },
            'manager': {
                user: 'Ex: Jeyakannan Sir (or manager)',
                pass: 'Ex: Dean@123'
            },
            'lead': {
                user: 'Ex: mem001 to 10 (or lead)',
                pass: 'Ex: team123'
            }
        };

        function onRoleChanged(roleKey) {
            const config = rolePlaceholders[roleKey] || rolePlaceholders['admin'];
            const uInput = document.getElementById('username');
            const pInput = document.getElementById('password');
            const errDiv = document.getElementById('loginError');

            if (errDiv) errDiv.classList.add('hidden');
            
            uInput.placeholder = config.user;
            pInput.placeholder = config.pass;
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('roleSelector');
            if (selector) onRoleChanged(selector.value);
        });

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("submitBtn");
            const errDiv = document.getElementById("loginError");
            const errMsg = document.getElementById("errorMessage");

            if (errDiv) errDiv.classList.add("hidden");
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    if (errMsg) errMsg.textContent = data.error || "Invalid username or password.";
                    if (errDiv) errDiv.classList.remove("hidden");
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = `<span>Sign In</span><i class="fa-solid fa-arrow-right text-xs ml-2"></i>`;
                    }
                    return;
                }

                // Redirect to dashboard
                window.location.replace("/");
            } catch (err) {
                console.error("Login error:", err);
                if (errMsg) errMsg.textContent = "Network error. Please try again.";
                if (errDiv) errDiv.classList.remove("hidden");
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<span>Sign In</span><i class="fa-solid fa-arrow-right text-xs ml-2"></i>`;
                }
            }
        });
    </script>
</body>
</html>
